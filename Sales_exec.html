<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Careers | Altius</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
/* Tokens lifted verbatim from altius-website/index.html */
  :root{
    --navy:#0A1D35;
    --navy-deep:#071528;
    --navy-card:#0E2440;
    --teal:#1AA6B0;
    --teal-bright:#35C4CE;
    --gold:#C0965A;
    --cream:#f5f8fa;
    --ink:#0A1D35;
    --muted:#54657c;
    --muted-dark:#9db0c4;
    --line:rgba(10,29,53,.10);
    --line-dark:rgba(255,255,255,.10);
    --radius-lg:28px;
    --radius-md:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--cream);color:var(--ink);line-height:1.6;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  h1,h2,h3,h4{font-family:'Sora',sans-serif;letter-spacing:-.02em;}
  a{color:inherit;text-decoration:none;}
  img,svg{display:block;}
  ul{list-style:none;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px;position:relative;z-index:1;}
  :focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px;}

  /* buttons */
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    font-family:'Sora',sans-serif;font-weight:600;font-size:15px;
    padding:15px 30px;border-radius:999px;border:none;cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease;white-space:nowrap;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:var(--teal);color:#fff;box-shadow:0 8px 24px rgba(26,166,176,.30);}
  .btn-primary:hover{background:var(--teal-bright);color:var(--navy-deep);}
  .btn-light{background:var(--teal-bright);color:var(--navy-deep);box-shadow:0 8px 24px rgba(53,196,206,.25);}
  .btn-light:hover{background:#fff;}
  .btn .arr{transition:transform .2s ease;}
  .btn:hover .arr{transform:translateX(3px);}

  /* nav */
  header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    background:rgba(245,248,250,.85);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .nav{max-width:1180px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:28px;}
  .brand-logo{width:132px;height:auto;display:block;}
  .brand{display:flex;align-items:center;gap:11px;font-family:'Sora',sans-serif;font-weight:700;font-size:21px;color:var(--navy);}
  .brand svg{width:30px;height:35px;}
  .brand .logo{height:30px;width:auto;}
  .brand .logo-failed{display:none;}
  .brand .logo-failed ~ .div::before{content:"Altius ";color:var(--navy);}
  .brand .div{color:var(--line);font-weight:400;}
  .brand .sub{color:var(--muted);font-weight:600;font-size:19px;}
  .nav-cta{display:flex;align-items:center;gap:18px;margin-left:auto;}
  .nav-cta .home{font-size:14.5px;font-weight:600;color:var(--muted);}
  .nav-cta .home:hover{color:var(--navy);}
  .nav-cta .btn{padding:11px 22px;font-size:14px;}

  /* blocks */
  section{position:relative;}
  .pad{padding:110px 0;}
  .block-dark{
    background:var(--navy-deep);color:#fff;border-radius:var(--radius-lg);
    margin:0 14px;overflow:hidden;position:relative;
  }
  .block-dark .wrap{padding-top:96px;padding-bottom:96px;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'Sora',sans-serif;font-size:12.5px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:20px;
  }
  .eyebrow::before{content:"";width:22px;height:2px;background:var(--gold);border-radius:2px;}
  .block-dark .eyebrow{color:var(--teal-bright);}
  h2{font-size:clamp(32px,4.6vw,54px);line-height:1.07;font-weight:700;max-width:15em;}
  .lead{font-size:18px;color:var(--muted);max-width:620px;margin-top:22px;}
  .block-dark .lead{color:var(--muted-dark);}

  /* topo texture */
  .topo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
  .topo svg{width:100%;height:100%;}
  .topo-light{color:rgba(10,29,53,.09);}
  .topo-dark{color:rgba(53,196,206,.10);}

  /* hero */
  .hero{padding:170px 0 80px;position:relative;overflow:hidden;}
  .hero-grid{display:grid;grid-template-columns:1.08fr 1fr;gap:56px;align-items:center;}
  .hero h1{font-size:clamp(42px,5.4vw,72px);line-height:1.02;font-weight:700;letter-spacing:-.03em;}
  .hero h1 .accent{color:var(--teal);}
  .hero .lead{font-size:18.5px;max-width:560px;}

  /* role cards (mirrors .hf-card / .res-card) */
  .role-stack{display:flex;flex-direction:column;gap:14px;}
  .role-card{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:26px 28px;box-shadow:0 8px 28px rgba(10,29,53,.07);
    display:flex;align-items:center;gap:20px;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .role-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(10,29,53,.12);}
  .role-card h3{font-size:19px;font-weight:600;line-height:1.3;}
  .role-card p{font-size:13.5px;color:var(--muted);margin-top:4px;}
  .role-card .go{margin-left:auto;font-family:'Sora',sans-serif;font-size:13.5px;font-weight:600;color:var(--teal);white-space:nowrap;}
  .role-card:hover .go .arr{display:inline-block;transform:translateX(3px);}
  .role-empty{font-size:15px;color:var(--muted);}

  .icon-chip{
    width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none;
  }
  .icon-chip svg{width:23px;height:23px;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .chip-teal{background:rgba(26,166,176,.13);}  .chip-teal svg{stroke:var(--teal);}
  .chip-gold{background:rgba(192,150,90,.15);}  .chip-gold svg{stroke:var(--gold);}

  /* stats strip */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:72px;padding-top:44px;border-top:1px solid var(--line);}
  .stat b{display:block;font-family:'Sora',sans-serif;font-size:clamp(28px,3.4vw,38px);font-weight:700;line-height:1;letter-spacing:-.02em;}
  .stat b i{font-style:normal;color:var(--teal);}
  .stat span{display:block;margin-top:9px;font-size:14px;color:var(--muted);}

  /* working-at cards */
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:60px;}
  .card{
    border-radius:var(--radius-md);padding:32px 28px;background:#fff;border:1px solid var(--line);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(10,29,53,.10);}
  .block-dark .card{background:var(--navy-card);border:1px solid var(--line-dark);}
  .block-dark .card:hover{box-shadow:0 16px 40px rgba(0,0,0,.35);}
  .card .icon-chip{margin-bottom:20px;}
  .block-dark .chip-teal{background:rgba(53,196,206,.14);} .block-dark .chip-teal svg{stroke:var(--teal-bright);}
  .card h3{font-size:19px;font-weight:600;margin-bottom:10px;line-height:1.3;}
  .card p{font-size:15px;color:var(--muted);}
  .block-dark .card p{color:var(--muted-dark);}

  /* timeline (hiring process — a genuine sequence) */
  .timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:60px;}
  .tl-step{border-left:2px solid rgba(53,196,206,.28);padding:4px 0 4px 22px;}
  .tl-step .n{font-family:'Sora',sans-serif;font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--gold);}
  .tl-step h3{font-size:17px;font-weight:600;margin:10px 0 8px;}
  .tl-step p{font-size:14.5px;color:var(--muted-dark);}

  /* role detail */
  .role-hero{padding:150px 0 70px;position:relative;overflow:hidden;}
  .role-hero h1{font-size:clamp(34px,4.6vw,56px);line-height:1.05;font-weight:700;letter-spacing:-.025em;max-width:20em;}
  .back{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;color:var(--muted);margin-bottom:26px;}
  .back:hover{color:var(--teal);}
  .role-body{display:grid;grid-template-columns:260px minmax(0,1fr);gap:56px;align-items:start;}
  .meta-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:28px;position:sticky;top:96px;}
  .meta-card dl div+div{margin-top:18px;}
  .meta-card dt{font-family:'Sora',sans-serif;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
  .meta-card dd{font-size:15.5px;font-weight:500;}
  .prose{max-width:660px;}
  .prose h3{font-size:22px;font-weight:600;margin:44px 0 16px;}
  .prose h3:first-child{margin-top:0;}
  .prose li{position:relative;padding-left:26px;margin-bottom:11px;font-size:16px;color:var(--muted);}
  .prose li::before{
    content:"";position:absolute;left:2px;top:11px;width:8px;height:8px;
    border-radius:3px;background:rgba(26,166,176,.25);border:1.5px solid var(--teal);
  }

  /* founder note */
  .note{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:52px 48px;max-width:820px;}
  .note .mark{font-family:'Sora',sans-serif;font-size:52px;line-height:.5;color:var(--gold);margin-bottom:26px;}
  .note p{font-size:19px;line-height:1.65;}
  .note .who{margin-top:28px;display:flex;align-items:center;gap:14px;}
  .note .avatar{
    width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#8a6a3c);
    display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;color:var(--navy-deep);font-size:15px;
  }
  .note .who b{display:block;font-size:15px;}
  .note .who span{font-size:13.5px;color:var(--muted);}

  /* final CTA */
  .final .wrap{text-align:center;}
  .final h2{margin:0 auto;font-size:clamp(32px,5vw,58px);}
  .final .lead{margin:22px auto 0;}
  .final .cta-row{display:flex;justify-content:center;margin-top:36px;}
  .final .contact{margin-top:30px;font-size:14.5px;color:var(--muted-dark);}
  .final .contact a{color:var(--teal-bright);font-weight:600;}

  /* footer */
  footer{padding:40px 0 40px;margin-top:40px;border-top:1px solid var(--line);}
  .foot-top{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap;align-items:flex-start;}
  .foot-brand p{margin-top:14px;font-size:14.5px;color:var(--muted);max-width:340px;}
  .foot-links h4{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
  .foot-links a{display:block;font-size:14.5px;color:var(--navy);margin-bottom:10px;font-weight:500;}
  .foot-links a:hover{color:var(--teal);}
  .foot-bottom{
    margin-top:52px;padding-top:24px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);
  }

  /* reveal */
  .reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease, transform .7s ease;}
  .reveal.in{opacity:1;transform:none;}
  .d1{transition-delay:.08s;} .d2{transition-delay:.16s;} .d3{transition-delay:.24s;}
  @media (prefers-reduced-motion:reduce){
    .reveal{opacity:1;transform:none;transition:none;}
    html{scroll-behavior:auto;}
    .btn:hover,.card:hover,.role-card:hover{transform:none;}
  }

  [hidden]{display:none !important;}

  @media (max-width:980px){
    .hero-grid{grid-template-columns:1fr;gap:44px;}
    .grid3,.timeline{grid-template-columns:1fr 1fr;}
    .stats{grid-template-columns:1fr 1fr;gap:26px;}
    .role-body{grid-template-columns:1fr;gap:32px;}
    .meta-card{position:static;}
  }
  @media (max-width:760px){
    .hero{padding:130px 0 60px;}
    .role-hero{padding:118px 0 50px;}
    .pad{padding:80px 0;}
    .block-dark{margin:0 8px;}
    .block-dark .wrap{padding-top:72px;padding-bottom:72px;}
    .grid3,.timeline{grid-template-columns:1fr;}
    .note{padding:36px 26px;}
    .brand .sub,.brand .div{display:none;}
    .role-card{flex-wrap:wrap;}
    .role-card .go{margin-left:66px;}
  }
  @media (max-width:480px){
    .stats{grid-template-columns:1fr;}
    .wrap{padding:0 18px;}
  }

  /* ---------- job page ---------- */
  body{display:flex;flex-direction:column;min-height:100vh;}
  main{flex:1;}
  .job{padding:132px 0 96px;position:relative;overflow:hidden;}
  .job h1{font-size:clamp(30px,4.2vw,48px);font-weight:700;letter-spacing:-.028em;max-width:22em;}
  .job .summary{margin-top:16px;font-size:19px;color:var(--muted);max-width:640px;line-height:1.55;}
  .facts{margin-top:40px;display:grid;gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));max-width:860px;}
  .fact{background:#fff;padding:18px 20px;}
  .fact dt{font-family:'Sora',sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  .fact dd{font-size:15.5px;font-weight:500;line-height:1.35;}
  .fact.pay dd{color:var(--teal);}
  .section{margin-top:56px;max-width:660px;}
  .section h2{font-size:23px;font-weight:600;margin-bottom:18px;}
  .section p{font-size:16.5px;color:var(--muted);margin-bottom:14px;}
  .section h3{font-size:18px;font-weight:600;margin:28px 0 12px;}
  .section li{position:relative;padding-left:26px;margin-bottom:11px;font-size:16.5px;color:var(--muted);}
  .section li::before{content:"";position:absolute;left:2px;top:11px;width:8px;height:8px;
    border-radius:3px;background:rgba(26,166,176,.22);border:1.5px solid var(--teal);}
  .steps{counter-reset:step;margin-top:4px;}
  .steps li{counter-increment:step;padding-left:40px;margin-bottom:16px;}
  .steps li::before{content:counter(step);position:absolute;left:0;top:-1px;width:26px;height:26px;
    border-radius:50%;background:rgba(26,166,176,.10);border:1.5px solid rgba(26,166,176,.45);
    color:var(--teal);font-family:'Sora',sans-serif;font-size:12.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;}
  .apply{margin-top:60px;max-width:660px;background:var(--navy-deep);color:#fff;
    border-radius:var(--radius-lg);padding:40px 38px;position:relative;overflow:hidden;}
  .apply h2{font-size:23px;font-weight:600;margin-bottom:14px;}
  .apply p{font-size:16px;color:var(--muted-dark);margin-bottom:22px;}
  .preview{
    position:relative;z-index:2;background:rgba(192,150,90,.13);
    border-bottom:1px solid rgba(192,150,90,.35);
    padding:11px 24px;text-align:center;font-size:13.5px;color:#6b5324;
  }
  .preview b{font-weight:600;}
  .gone{padding:180px 0 120px;text-align:center;}
  .preview ~ main .job{padding-top:44px;}
  .gone h1{font-size:32px;font-weight:700;margin-bottom:16px;}
  .gone p{color:var(--muted);font-size:17px;}
  .gone a{color:var(--teal);font-weight:600;}
  @media (max-width:760px){
    .job{padding:104px 0 56px;}
    .apply{padding:30px 24px;}
    .facts{grid-template-columns:1fr 1fr;}
    .brand-logo{width:108px;}
    .nav{padding:12px 20px;gap:16px;}
    .nav-cta .home{font-size:13.5px;}
    .section{margin-top:40px;}
    .section h2{font-size:21px;}
    .job .summary{font-size:17px;}
  }
  @media (max-width:480px){
    .job{padding:96px 0 48px;}
    .facts{grid-template-columns:1fr;}
    .brand-logo{width:96px;}
    .apply{padding:26px 20px;}
    .section p,.section li{font-size:15.5px;}
  }
</style>
</head>

</div>

<main>
  <section class="job" id="view-job" hidden>
    <div class="topo topo-light" aria-hidden="true"><svg viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice"><use href="#topo-lines"/></svg></div>
    <div class="wrap">
      <h1 id="j-title"></h1>
      <p class="summary" id="j-summary" hidden></p>
      <dl class="facts" id="j-facts"></dl>
      <div id="j-sections"></div>
      <div class="apply" id="j-apply"></div>
    </div>
  </section>

  <section class="gone" id="view-gone" hidden>
    <div class="wrap">
      <h1>This role isn&rsquo;t open any more</h1>
      <p>It may have been filled or withdrawn. <a href="https://altius.capital">altius.capital</a></p>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="foot-bottom" style="margin-top:0;padding-top:0;border-top:none">
      <span>&copy; 2026 Altius Capital</span>
      <a href="https://altius.capital">altius.capital</a>
    </div>
  </div>
</footer>

<script>
/* ==============================================================
   PASTE THE GOOGLE SHEET LINK BETWEEN THE QUOTES BELOW.
   Copy it from the address bar with the Sheet open. Nothing needs
   trimming. Share the Sheet as "Anyone with the link - Viewer".
   ============================================================== */
const SHEET = "https://docs.google.com/spreadsheets/d/1113aMb5xFYAgIIDb9zo32zaaHlvkm-VXEmtIH-wG19I/edit?usp=drive_link";

const TAB_ROLES = "Roles";
const HOME = "https://altius.capital";

/* Which row of the Sheet this page shows. Must match the
   "Page name (for the link)" cell for the role.
   To add another job: copy this file, change this one line. */
const ROLE = "executive-sales-lead";

function sheetId(v){
  if(!v) return "";
  const m = String(v).match(/\/d\/([a-zA-Z0-9-_]{20,})/);
  return m ? m[1] : String(v).trim();
}
const SHEET_ID = sheetId(SHEET);
const csvUrl = tab => "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
  "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(tab) +
  "&_=" + Date.now();   // skips the browser cache on every load

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slugify = t => String(t).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const lines = v => String(v||"").split(/\r?\n|\r/).map(x=>x.trim()).filter(Boolean);
const strip = l => l.replace(/^[-*\u2022]\s+/,"");

const cell = (row, name) => {
  const k = Object.keys(row).find(k => k.trim().toLowerCase() === name.toLowerCase());
  return k ? String(row[k] || "").trim() : "";
};

function blocks(text){
  let out = "", open = false;
  lines(text).forEach(l => {
    const b = /^[-*\u2022]\s+/.test(l);
    if(b && !open){ out += "<ul>"; open = true; }
    if(!b && open){ out += "</ul>"; open = false; }
    if(b)                    out += "<li>" + esc(strip(l)) + "</li>";
    else if(l.endsWith(":")) out += "<h3>" + esc(l.slice(0,-1)) + "</h3>";
    else                     out += "<p>" + esc(l) + "</p>";
  });
  return out + (open ? "</ul>" : "");
}
const bullets = text => {
  const items = lines(text);
  return items.length ? "<ul>" + items.map(l => "<li>" + esc(strip(l)) + "</li>").join("") + "</ul>" : "";
};

function parseRoles(rows){
  const out = {};
  rows.filter(r => cell(r,"Show").toLowerCase().startsWith("y"))
      .filter(r => cell(r,"Role title"))
      .forEach(r => {
        const key = cell(r,"Page name (for the link)") || slugify(cell(r,"Role title"));
        out[slugify(key)] = {
          title:    cell(r,"Role title"),
          summary:  cell(r,"Summary"),
          location: cell(r,"Location"),
          model:    cell(r,"Work model"),
          type:     cell(r,"Employment type"),
          salary:   cell(r,"Salary range"),
          team:     cell(r,"Team"),
          reports:  cell(r,"Reports to"),
          about:    cell(r,"About Altius"),
          doing:    cell(r,"What you'll do"),
          looking:  cell(r,"What we're looking for"),
          nice:     cell(r,"Nice to have"),
          process:  cell(r,"Hiring process"),
          send:     cell(r,"What to send us"),
          apply:    cell(r,"Apply to (email or link)")
        };
      });
  return out;
}

function render(r){
  document.title = r.title + " | Altius";
  $("j-title").textContent = r.title;
  const sum = $("j-summary");
  sum.textContent = r.summary; sum.hidden = !r.summary;

  const facts = [
    ["Location", r.location, ""],
    ["Work model", r.model, ""],
    ["Type", r.type, ""],
    ["Salary", r.salary, "pay"],
    ["Team", r.team, ""],
    ["Reports to", r.reports, ""]
  ].filter(f => f[1]);
  const fl = $("j-facts");
  fl.innerHTML = facts.map(f =>
    '<div class="fact ' + f[2] + '"><dt>' + esc(f[0]) + "</dt><dd>" + esc(f[1]) + "</dd></div>").join("");
  fl.hidden = !facts.length;

  const secs = [
    ["What you'll do", bullets(r.doing)],
    ["What we're looking for", bullets(r.looking)],
    ["Nice to have", bullets(r.nice)],
    ["Hiring process", r.process
      ? '<ul class="steps">' + lines(r.process).map(l => "<li>" + esc(strip(l)) + "</li>").join("") + "</ul>"
      : ""],
    ["About Altius", blocks(r.about)]
  ].filter(s => s[1]);
  $("j-sections").innerHTML = secs.map(s =>
    '<div class="section"><h2>' + esc(s[0]) + "</h2>" + s[1] + "</div>").join("");

  const target = r.apply;
  const isMail = !target || target.indexOf("@") > -1;
  const href = isMail
    ? "mailto:" + (target || "careers@altius.capital") + "?subject=" + encodeURIComponent(r.title)
    : target;
  $("j-apply").innerHTML =
    "<h2>Apply</h2>" +
    (r.send ? "<p>" + esc(r.send) + "</p>" : "") +
    '<a class="btn btn-light" href="' + esc(href) + '">' +
    (isMail ? "Apply by email" : "Apply now") + ' <span class="arr">&rarr;</span></a>';

  $("view-job").hidden = false;
  $("view-gone").hidden = true;
}

/* Shown only while SHEET is empty, so the page can be looked at
   before the spreadsheet exists. The Sheet replaces all of it. */
const DEMO = {
  title:"Example role",
  summary:"This whole page is filled in from the spreadsheet. Replace every word of it.",
  location:"Tel Aviv", model:"Hybrid, 3 days in office", type:"Full time",
  salary:"Add a real range here", team:"Engineering", reports:"VP R&D",
  about:"This paragraph is the About Altius column, and it can be written differently for each role.",
  doing:"- One line per bullet point\n- Starting each line with a dash\n- As many as you need",
  looking:"- Must-have experience\n- Must-have skill",
  nice:"- Bonus experience",
  process:"Intro call, 30 minutes\nTake-home exercise\nMeet the team\nOffer or a clear no within a week",
  send:"A CV and a short paragraph on why this role.",
  apply:"careers@altius.capital"
};

async function boot(){
  const want = new URLSearchParams(location.search).get("job")
            || location.hash.replace(/^#\/?/, "")
            || ROLE;

  /* No spreadsheet connected yet: show the example so the page can be seen. */
  if(!SHEET_ID){
    $("preview-bar").hidden = false;
    render(DEMO);
    return;
  }

  let roles = {};
  try{
    /* Parsed without assuming row 1 is the header row, since some
       copies of the sheet have an instructional sentence above the
       real "Show / Role title / ..." header row. Whichever row
       contains a "Show" cell is treated as the real header row. */
    const raw = await new Promise((res, rej) =>
      Papa.parse(csvUrl(TAB_ROLES), { download:true, skipEmptyLines:true,
        complete: r => res(r.data), error: rej }));
    const headerIdx = raw.findIndex(row =>
      row.some(c => String(c).trim().toLowerCase() === "show"));
    if(headerIdx > -1){
      const headers = raw[headerIdx];
      const rows = raw.slice(headerIdx + 1).map(r => {
        const obj = {};
        headers.forEach((h, i) => obj[h] = r[i]);
        return obj;
      });
      roles = parseRoles(rows);
    }
  }catch(e){ console.warn("Sheet not reachable.", e); }

  const r = roles[slugify(want)];
  if(r) render(r);
  else { $("view-gone").hidden = false; document.title = "Role closed | Altius"; }
}
boot();
</script>
</body>
</html>
