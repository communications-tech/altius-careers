const ROW_SHOW          = 2;   // "Show": only roles marked yes are listed

const ROW_LINK          = 5;   // "Link to send"
const ROW_DEPARTMENT    = 10;  // "Team"

  a.role:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .title { font: 400 1.4rem/1.25 "Newsreader", Georgia, serif; }
  a.role:hover .title { color: var(--brass); }
  .dept { color: var(--muted); font-size: 0.92rem; white-space: nowrap; }
  .status { color: var(--muted); padding: 1rem 0; }
  .status strong { color: var(--ink); font-weight: 500; }

<main>
  <h1>Open roles</h1>
  <p class="lede">Every position we’re hiring for at Altius Capital. <span class="count" id="count"></span></p>
  <div id="roles"><p class="status">Loading roles…</p></div>
</main>

<script>
function parseCSV(text) {
  const rows = []; let row = []; let cell = ""; let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
const cellAt = (rows, r, c) => (rows[r - 1] && rows[r - 1][c - 1] ? rows[r - 1][c - 1].trim() : "");
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const showStatus = html =>
  (document.getElementById("roles").innerHTML = '<p class="status">' + html + "</p>");

async function load() {
  let rows;
  try {
    const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    rows = parseCSV(await res.text());
  } catch (e) {
    showStatus("<strong>Couldn’t load the roles list.</strong> Refresh the page, or check that the sheet is shared as “Anyone with the link can view”.");
    return;
  }
  const width = Math.max(...rows.map(r => r.length));
  const roles = [];
  for (let c = FIRST_ROLE_COLUMN; c <= width; c++) {
    const link = cellAt(rows, ROW_LINK, c);
    const show = cellAt(rows, ROW_SHOW, c).toLowerCase();
    if (!link || show !== "yes") continue;
    roles.push({
      title: cellAt(rows, ROW_TITLE, c) || link.split("/").pop().replace(/\.html?$/i, ""),
      dept: cellAt(rows, ROW_DEPARTMENT, c),
      link
    });
  }
  if (!roles.length) {
    showStatus("<strong>No open roles right now.</strong> Check back soon.");
    return;
  }
  roles.sort((a, b) => (a.dept || "~").localeCompare(b.dept || "~") || a.title.localeCompare(b.title));
  const ul = el("ul");
  roles.forEach(r => {
    const li = el("li");
    const a = el("a", "role");
    a.href = r.link;
    a.appendChild(el("span", "title", r.title));
    if (r.dept) a.appendChild(el("span", "dept", r.dept));
    li.appendChild(a); ul.appendChild(li);
  });
  const wrap = document.getElementById("roles");
  wrap.innerHTML = ""; wrap.appendChild(ul);
  document.getElementById("count").textContent =
    roles.length === 1 ? "1 open role." : roles.length + " open roles.";
}
load();
</script>
