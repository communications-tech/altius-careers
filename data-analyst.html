  :root{
    --navy:#0A1D35;
    --navy-deep:#071528;
    --navy-card:#0E2440;
    --teal:#1AA6B0;
    --teal-bright:#35C4CE;
    --gold:#C0965A;
    --cream:#f5f8fa;
    --ink:#0A1D35;
    --muted:#54657c;
    --muted-dark:#9db0c4;
    --line:rgba(10,29,53,.10);
    --line-dark:rgba(255,255,255,.10);
    --radius-lg:28px;
    --radius-md:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--cream);color:var(--ink);line-height:1.6;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  h1,h2,h3,h4{font-family:'Sora',sans-serif;letter-spacing:-.02em;}
  a{color:inherit;text-decoration:none;}
  img,svg{display:block;}
  ul{list-style:none;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px;position:relative;z-index:1;}
  :focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px;}
